<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="header-container"></div>

    <div id="content">

        <div id="posts">

            <!-- abertura postagem -->
            <div class="post">
                <form action="" method="post" class="form-contato" id="formulario">
                    <div id="mensagem-status"></div>
                    <h2>📧 Entre em Contato</h2>
                    <p>
                        Se desejar, preencha o formulário abaixo para entrar em contato comigo.
                    </p>

                    <div class="campo">
                        <label for="nome">Nome:
                            <span id="erro-nome" class="campo-obrigatorio">*</span>
                        </label>
                        <input type="text" id="nome" placeholder="Digite seu nome" >
                    </div>

                    <div class="campo">
                        <label for="email">E-mail:
                            <span id="erro-email" class="campo-obrigatorio">*</span>
                        </label>
                        <input type="text" id="email" placeholder="Digite seu e-mail" >
                    </div>

                    <div class="campo">
                        <label for="titulo">Assunto:
                            <span id="erro-titulo" class="campo-obrigatorio">*</span>
                        </label>
                        <input type="text" id="titulo" placeholder="Título da mensagem" >
                    </div>

                    <div class="campo textarea">
                        <label for="mensagem">Mensagem:
                            <span id="erro-mensagem" class="campo-obrigatorio">*</span>
                        </label>
                        <textarea id="mensagem" rows="6" placeholder="Deixe sua mensagem" ></textarea>
                    </div>

                    <button type="submit" class="botao-enviar">
                        Enviar Mensagem
                    </button>
                    
                </form>
            </div>
            <!--fechamento postagem -->

        </div>

        <div id="right-side">
            <div id="temas-container"></div>
            <div id="sidebar-container"></div>
        </div>

    </div>
    <div id="footer-container"></div>
    <div id="btn-topo-container"></div>
    <script src="js/script.js"></script>

</body>

</html>
