<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="header-container"></div>

    <div id="content">

        <div id="posts">

            <!-- abertura postagem -->
            <div class="post">
                <form action="" method="post" class="form-contato">
                    <h2>📧 Entre em Contato</h2>
                    <p>
                        Se desejar, preencha o formulário abaixo para entrar em contato comigo.
                    </p>

                    <div class="campo">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" placeholder="Digite seu nome">
                    </div>

                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail">
                    </div>

                    <div class="campo">
                        <label for="titulo">Assunto:</label>
                        <input type="text" id="titulo" placeholder="Título da mensagem">
                    </div>

                    <div class="campo textarea">
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" rows="6" placeholder="Deixe sua mensagem"></textarea>
                    </div>

                    <button type="submit" class="botao-enviar">
                        Enviar Mensagem
                    </button>
                </form>
            </div>
            <!--fechamento postagem -->

        </div>

        <div id="right-side">
            <div id="temas-container"></div>
            <div id="sidebar-container"></div>
        </div>

        <div id="footer-container"></div>

    </div>
    <div id="btn-topo-container"></div>
    <script src="js/script.js"></script>

</body>

</html>
